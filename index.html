<!DOCTYPE html>
<!-- lang="he" dir="rtl": the page is in Hebrew and reads from right to left -->
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ספרינט פורטפוליו תקש״ח 2026 – האתר יעלה בקרוב</title>

  <!-- Font: David Libre from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=David+Libre:wght@400;700&display=swap" rel="stylesheet">

  <!-- "?v=3" makes the browser load the newest version instead of an old saved copy -->
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <div class="page page--coming-soon">

    <!-- ===== Top bar (stays at the top when you scroll) ===== -->
    <!-- No menu links here: the rest of the site is still being built -->
    <header class="site-header">
      <div class="site-header__bar">
        <p class="site-header__title">ספרינט פורטפוליו תקש״ח 2026</p>
      </div>
    </header>

    <!-- ===== Big logo ===== -->
    <div class="hero-logo">
      <img src="images/coming-soon-logo-circle.svg" width="149.866" height="149.866" alt="">
      <img src="images/coming-soon-logo-dots.svg" width="150.199" height="150.123" alt="">
    </div>

    <main class="main">
      <section class="intro">
        <div class="intro__content">
          <h1 class="coming-soon__title">האתר יעלה בעוד</h1>

          <!-- Countdown. The numbers are filled in by countdown.js -->
          <!-- dir="ltr" keeps the order from Figma: weeks on the left, seconds on the right -->
          <div class="countdown" dir="ltr" aria-live="off">
            <div class="countdown__item">
              <span class="countdown__number" id="countdown-weeks">00</span>
              <span class="countdown__label">שבועות</span>
            </div>
            <span class="countdown__divider" aria-hidden="true"></span>
            <div class="countdown__item">
              <span class="countdown__number" id="countdown-days">00</span>
              <span class="countdown__label">ימים</span>
            </div>
            <span class="countdown__divider" aria-hidden="true"></span>
            <div class="countdown__item">
              <span class="countdown__number" id="countdown-hours">00</span>
              <span class="countdown__label">שעות</span>
            </div>
            <span class="countdown__divider" aria-hidden="true"></span>
            <div class="countdown__item">
              <span class="countdown__number" id="countdown-minutes">00</span>
              <span class="countdown__label">דקות</span>
            </div>
            <span class="countdown__divider" aria-hidden="true"></span>
            <div class="countdown__item">
              <span class="countdown__number" id="countdown-seconds">00</span>
              <span class="countdown__label">שניות</span>
            </div>
          </div>
        </div>
      </section>
    </main>

  </div>

  <script src="countdown.js"></script>
</body>
</html>
